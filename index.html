<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061b4f" />
    <meta name="description" content="睡眠氧舱 H5 展示页" />
    <title>睡眠氧舱</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="app" aria-label="睡眠氧舱 H5">
      <section class="stage" id="stage" aria-live="polite">
        <div class="slides" id="slides">
          <article class="slide is-active"><img src="./assets/images/optimized/01.webp" alt="睡眠氧舱，让每一晚呼吸更从容" fetchpriority="high" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/02.webp" alt="四大核心优势，重新定义无感氧护" loading="lazy" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/03.webp" alt="为真正重视休息质量的人而设" loading="lazy" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/04.webp" alt="头肩轻氧舱体设计" loading="lazy" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/05.webp" alt="从高原到日常，让每一晚呼吸更从容" loading="lazy" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/06.webp" alt="睡不好，往往不是因为床" loading="lazy" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/07.webp" alt="四重轻氧睡眠体验" loading="lazy" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/08.webp" alt="产品细节，决定体验上限" loading="lazy" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/09.webp" alt="简单 4 步，进入轻氧睡眠状态" loading="lazy" decoding="async" /></article>
          <article class="slide"><img data-src="./assets/images/optimized/10.webp" alt="四色可选，融入不同空间气质" loading="lazy" decoding="async" /></article>
        </div>

        <button class="music-btn" id="musicBtn" type="button" aria-label="播放背景音乐" aria-pressed="false">
          <img class="music-icon" src="./assets/images/music-icon.png" alt="" aria-hidden="true" />
        </button>
        <audio id="bgm" src="./assets/audio/bgm.mp3" loop preload="none"></audio>

        <div class="pager" id="pager" aria-label="页码导航"></div>
        <div class="swipe-hint" id="swipeHint" aria-hidden="true">
          <span></span>
          <b>上滑翻页</b>
        </div>
      </section>
    </main>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
